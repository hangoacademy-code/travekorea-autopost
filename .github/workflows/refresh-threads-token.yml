name: Refresh Threads token

on:
  schedule:
    - cron: "0 1 */7 * *"    # tiap ~7 hari; token Threads berlaku 60 hari
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and store new token
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}   # fine-grained PAT: Secrets read/write untuk repo ini
          REPO: ${{ github.repository }}
        run: |
          NEW=$(curl -sf "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token=${THREADS_TOKEN}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          test -n "$NEW"
          gh secret set THREADS_TOKEN --repo "$REPO" --body "$NEW"
          echo "Threads token diperbarui."
